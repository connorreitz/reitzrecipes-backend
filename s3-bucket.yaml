AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket for recipe images with secure access

Resources:
  RecipeImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "reitz-recipes-${AWS::Region}-${AWS::AccountId}-images"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecipeImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::${RecipeImagesBucket}
              - !Sub arn:aws:s3:::${RecipeImagesBucket}/*

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${RecipeImagesBucket}
                  - !Sub arn:aws:s3:::${RecipeImagesBucket}/*

Outputs:
  BucketName:
    Description: Name of S3 bucket for recipe images
    Value: !Ref RecipeImagesBucket
  BucketArn:
    Description: ARN of S3 bucket
    Value: !GetAtt RecipeImagesBucket.Arn
